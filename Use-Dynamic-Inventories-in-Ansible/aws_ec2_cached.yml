plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
  - us-west-2
hostnames:
  - tag:Name
compose:
  ansible_host: public_ip_address
keyed_groups:
  - prefix: tag
    key: tags
filters:
  instance-state-name: running
# Enable caching
cache: true
cache_plugin: jsonfile
cache_timeout: 3600
cache_connection: /tmp/ansible-inventory-cache
cache_prefix: aws_ec2
